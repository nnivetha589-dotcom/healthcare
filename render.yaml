services:
  - type: web
    name: medimate
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
